<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Lincoln Trojans Game Clock</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101010;color:white;min-height:100dvh;display:flex;align-items:center;justify-content:center}.wrap{width:min(100%,780px);padding:24px;text-align:center}.brand{font-size:clamp(18px,4vw,28px);font-weight:850;letter-spacing:.09em}.accent{height:5px;width:90px;background:#c51b28;margin:16px auto 24px;border-radius:4px}.half{font-size:clamp(17px,3vw,25px);color:#ddd;font-weight:700;margin-bottom:12px}.clock{font-variant-numeric:tabular-nums;font-size:clamp(76px,18vw,160px);font-weight:800;letter-spacing:-.06em;line-height:1.15;margin:12px 0 8px}.caption{color:#bbb;font-size:14px;margin-bottom:25px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px;margin:0 auto}button{border:0;border-radius:12px;padding:17px 12px;color:white;font-weight:750;font-size:18px;background:#303030;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}.primary{background:#c51b28}.halfbuttons{display:flex;gap:10px;justify-content:center;margin:22px 0}.halfbuttons button{font-size:15px;padding:11px 18px}.halfbuttons .active{background:#c51b28}.status{min-height:24px;color:#ccc;margin-top:18px}.note{font-size:12px;color:#999;line-height:1.5;margin-top:25px}@media (max-width:400px){.wrap{padding:15px}.clock{font-size:22vw}button{font-size:16px}}@media (display-mode:fullscreen){.wrap{max-width:1000px}.clock{font-size:clamp(100px,22vw,240px)}}
</style></head><body><main class="wrap"><div class="brand">LINCOLN TROJANS</div><div class="accent"></div><div class="half" id="halfLabel">FIRST HALF</div><div class="clock" id="clock" role="timer" aria-label="Elapsed game time">00:00</div><div class="caption">COUNT UP · 40 MINUTES PER HALF</div><div class="controls"><button class="primary" id="toggle">Start</button><button id="reset">Reset</button><button id="fullscreen">Full Screen</button><button id="wake">Keep Screen Awake</button></div><div class="halfbuttons"><button class="active" id="first">1st Half</button><button id="second">2nd Half</button></div><div class="status" id="status" aria-live="polite">Ready</div><div class="note">Unofficial coaching reference only. The referee's time controls the match.<br>Keep this page open during play. Screen-awake and full-screen features depend on your device and AppSheet browser.</div></main><script>
(()=>{'use strict';const LIMIT=2400000;const $=id=>document.getElementById(id);let half=1,elapsed=0,startedAt=0,running=false,wakeLock=null;const fmt=ms=>{const s=Math.floor(Math.min(LIMIT,Math.max(0,ms))/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};const current=()=>running?Math.min(LIMIT,elapsed+(Date.now()-startedAt)):elapsed;function draw(){const ms=current();$('clock').textContent=fmt(ms);$('toggle').textContent=running?'Pause':ms>=LIMIT?'Finished':ms>0?'Resume':'Start';$('toggle').disabled=ms>=LIMIT;if(running&&ms>=LIMIT){running=false;elapsed=LIMIT;$('status').textContent='40:00 reached — half complete';releaseWake()} }function pause(){elapsed=current();running=false;draw()}function reset(){running=false;elapsed=0;$('status').textContent='Ready';draw();releaseWake()}function setHalf(n){if(running&&!confirm('Switch halves and reset the clock?'))return;half=n;reset();$('halfLabel').textContent=n===1?'FIRST HALF':'SECOND HALF';$('first').classList.toggle('active',n===1);$('second').classList.toggle('active',n===2)}$('toggle').addEventListener('click',()=>{if(running){pause();$('status').textContent='Paused'}else if(elapsed<LIMIT){startedAt=Date.now();running=true;$('status').textContent='Running';draw()}});$('reset').addEventListener('click',()=>{if(running&&!confirm('Reset the running clock to 00:00?'))return;reset()});$('first').addEventListener('click',()=>setHalf(1));$('second').addEventListener('click',()=>setHalf(2));$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{$('status').textContent='Full-screen not supported in this browser'}}catch(e){$('status').textContent='Full-screen unavailable in this view'}});$('wake').addEventListener('click',async()=>{if(!('wakeLock' in navigator)){$('status').textContent='Screen-awake not supported here';return}try{wakeLock=await navigator.wakeLock.request('screen');$('status').textContent='Screen-awake enabled'}catch(e){$('status').textContent='Screen-awake unavailable here'}});async function releaseWake(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});setInterval(draw,150);draw()})();
</script></body></html>
